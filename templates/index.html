<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Force Alignment Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Audio Force Alignment Tool</h1>
        
        <!-- Step 1: Upload Metadata -->
        <div class="row" id="step1">
            <div class="col-md-6 offset-md-3">
                <div class="card">
                    <div class="card-header">
                        <h5>Step 1: Upload Metadata (CSV or SRT)</h5>
                    </div>
                    <div class="card-body">
                        <form id="metadataForm">
                            <div class="mb-3">
                                <label for="metadataFile" class="form-label">Metadata File (CSV/SRT)</label>
                                <input type="file" class="form-control" id="metadataFile" accept=".csv,.srt" required>
                                <small class="text-muted">CSV format: start,end,speaker,en,ro. SRT format is also supported.</small>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="analyzeBtn">Analyze Metadata</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Step 2: Character Audio Slots -->
        <div class="row d-none" id="step2">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5>Step 2: Upload Character Audio</h5>
                        <button class="btn btn-sm btn-outline-secondary" onclick="resetProcess()">Reset</button>
                    </div>
                    <div class="card-body">
                        <p id="metadataInfo" class="mb-3"></p>
                        <form id="processForm">
                            <div id="characterSlots" class="mb-4">
                                <!-- Character slots will be inserted here -->
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="minGap" class="form-label">Min gap between segments (s)</label>
                                    <input type="number" class="form-control" id="minGap" value="0" step="0.1" min="0">
                                </div>
                                <div class="col-md-6 d-flex align-items-end">
                                    <div class="form-check mb-2">
                                        <input type="checkbox" class="form-check-input" id="useWhisper" checked>
                                        <label class="form-check-label" for="useWhisper">Use Whisper</label>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success w-100" id="processBtn">Process Selected Characters</button>
                        </form>
                        
                        <div class="progress mt-3 d-none" id="progressBar">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                 role="progressbar" style="width: 100%">Processing...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Results Section -->
        <div class="row mt-4 d-none" id="resultsSection">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Processing Results</h5>
                    </div>
                    <div class="card-body">
                        <div id="results"></div>
                        <div class="mt-3">
                            <button class="btn btn-success" id="downloadAllBtn" onclick="downloadAll()">Download All Tracks</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentMetadata = null;

        document.getElementById('metadataForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('metadataFile').files[0];
            const formData = new FormData();
            formData.append('metadata', file);

            try {
                const response = await fetch('/upload_metadata', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.success) {
                    currentMetadata = result;
                    showStep2(result);
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        function showStep2(data) {
            document.getElementById('step1').classList.add('d-none');
            document.getElementById('step2').classList.remove('d-none');
            document.getElementById('metadataInfo').innerText = `File: ${data.filename} | Detected ${data.speakers.length} speakers.`;

            const slotsDiv = document.getElementById('characterSlots');
            slotsDiv.innerHTML = '<h6>Assign audio for each character:</h6>';

            data.speakers.forEach((speaker, index) => {
                const count = data.segments.filter(s => s.speaker === speaker).length;
                const slot = `
                    <div class="card mb-2 bg-light">
                        <div class="card-body p-2">
                            <div class="row align-items-center">
                                <div class="col-md-1">
                                    <input type="checkbox" class="form-check-input speaker-select" data-speaker="${speaker}" checked>
                                </div>
                                <div class="col-md-3">
                                    <strong>${speaker}</strong> <br>
                                    <small class="text-muted">${count} segments</small>
                                </div>
                                <div class="col-md-8">
                                    <input type="file" class="form-control form-control-sm audio-input" data-speaker="${speaker}" accept="audio/*">
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                slotsDiv.innerHTML += slot;
            });
        }

        function resetProcess() {
            document.getElementById('step1').classList.remove('d-none');
            document.getElementById('step2').classList.add('d-none');
            document.getElementById('resultsSection').classList.add('d-none');
            document.getElementById('metadataForm').reset();
            currentMetadata = null;
        }

        document.getElementById('processForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('metadata_filename', currentMetadata.filename);
            formData.append('use_whisper', document.getElementById('useWhisper').checked);
            formData.append('min_gap', document.getElementById('minGap').value || 0);
            
            const selects = document.querySelectorAll('.speaker-select:checked');
            if (selects.length === 0) {
                alert('Select at least one speaker to process.');
                return;
            }

            let hasAudio = false;
            selects.forEach(select => {
                const speaker = select.getAttribute('data-speaker');
                const input = document.querySelector(`.audio-input[data-speaker="${speaker}"]`);
                if (input.files[0]) {
                    formData.append(`audio_${speaker}`, input.files[0]);
                    hasAudio = true;
                }
                formData.append('speakers', speaker);
            });

            if (!hasAudio) {
                alert('Upload at least one audio file.');
                return;
            }

            // Also send back the segments data
            formData.append('segments', JSON.stringify(currentMetadata.segments));

            // Show progress
            document.getElementById('progressBar').classList.remove('d-none');
            document.getElementById('processBtn').disabled = true;
            
            try {
                // We'll update /process to handle this new format
                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    displayResults(result);
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error processing files: ' + error.message);
            } finally {
                document.getElementById('progressBar').classList.add('d-none');
                document.getElementById('processBtn').disabled = false;
            }
        });
        
        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            document.getElementById('resultsSection').classList.remove('d-none');
            
            let html = '<h6>Aligned Character Tracks:</h6>';
            html += '<div class="list-group">';
            
            data.output_files.forEach(track => {
                html += `
                    <div class="list-group-item">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${track.speaker}</strong>
                                <br>
                                <small>${track.file}</small>
                            </div>
                            <div>
                                <audio controls src="/preview/${track.file}"></audio>
                                <a href="/download/${track.file}" class="btn btn-sm btn-primary">Download</a>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            resultsDiv.innerHTML = html;
        }
        
        function downloadAll() {
            // In a real app, this might zip all results
            alert('This would download a zip of all tracks.');
        }
    </script>
</body>
</html>
