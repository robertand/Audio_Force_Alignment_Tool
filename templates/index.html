<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Force Alignment Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Audio Force Alignment Tool</h1>
        
        <!-- Step 1: Upload Metadata -->
        <div class="row" id="step1">
            <div class="col-md-6 offset-md-3">
                <div class="card">
                    <div class="card-header">
                        <h5>Step 1: Upload Metadata (CSV or SRT)</h5>
                    </div>
                    <div class="card-body">
                        <form id="metadataForm">
                            <div class="mb-3">
                                <label for="metadataFile" class="form-label">Metadata File (CSV/SRT)</label>
                                <input type="file" class="form-control" id="metadataFile" accept=".csv,.srt" required>
                                <small class="text-muted">CSV format: start,end,speaker,en,ro. SRT format is also supported.</small>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="analyzeBtn">Analyze Metadata</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Step 2: Character Audio Slots -->
        <div class="row d-none" id="step2">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5>Step 2: Upload Character Audio</h5>
                        <button class="btn btn-sm btn-outline-secondary" onclick="resetProcess()">Reset</button>
                    </div>
                    <div class="card-body">
                        <p id="metadataInfo" class="mb-3"></p>
                        <form id="processForm">
                            <div id="characterSlots" class="mb-4">
                                <!-- Character slots will be inserted here -->
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="minGap" class="form-label">Min gap between segments (s)</label>
                                    <input type="number" class="form-control" id="minGap" value="0" step="0.1" min="0">
                                </div>
                                <div class="col-md-6">
                                    <label for="alignerType" class="form-label">Alignment Engine</label>
                                    <select class="form-select mb-2" id="alignerType" onchange="updateModelOptions()">
                                        <option value="whisper">OpenAI Whisper</option>
                                        <option value="mms">MahmoudAshraf MMS Aligner</option>
                                    </select>

                                    <div id="whisperSettings">
                                        <label for="modelSize" class="form-label">Whisper Model Size</label>
                                        <select class="form-select" id="modelSize">
                                            <option value="base">Base (Fast)</option>
                                            <option value="small">Small (Better)</option>
                                            <option value="medium">Medium (Accurate)</option>
                                            <option value="large-v3">Large-v3 (Maximum Accuracy)</option>
                                        </select>
                                    </div>

                                    <div class="form-check mt-2">
                                        <input type="checkbox" class="form-check-input" id="useWhisper" checked>
                                        <label class="form-check-label" for="useWhisper">Use Aligner</label>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success w-100" id="processBtn">Process Selected Characters</button>
                        </form>
                        
                        <div class="progress mt-3 d-none" id="progressBar">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                 role="progressbar" style="width: 100%">Processing...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Results Section -->
        <div class="row mt-4 d-none" id="resultsSection">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Processing Results</h5>
                    </div>
                    <div class="card-body">
                        <div id="results"></div>
                        <div class="mt-3">
                            <button class="btn btn-success" id="downloadAllBtn" onclick="downloadAll()">Download All Tracks</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentMetadata = null;

        document.getElementById('metadataForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('metadataFile').files[0];
            const formData = new FormData();
            formData.append('metadata', file);

            try {
                const response = await fetch('/upload_metadata', {
                    method: 'POST',
                    body: formData
                });
                const text = await response.text();
                let result;
                try {
                    result = JSON.parse(text);
                } catch (e) {
                    console.error("Failed to parse JSON:", text);
                    alert("The server returned an invalid response (not JSON).");
                    return;
                }
                if (result.success) {
                    currentMetadata = result;
                    showStep2(result);
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
                console.error(error);
            }
        });

        function toggleAll(checked) {
            document.querySelectorAll('.speaker-select').forEach(cb => {
                cb.checked = checked;
            });
        }

        function showStep2(data) {
            document.getElementById('step1').classList.add('d-none');
            document.getElementById('step2').classList.remove('d-none');
            document.getElementById('metadataInfo').innerText = `File: ${data.filename} | Detected ${data.speakers.length} speakers.`;

            const slotsDiv = document.getElementById('characterSlots');
            slotsDiv.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6>Assign audio for each character:</h6>
                    <div>
                        <button type="button" class="btn btn-xs btn-outline-primary py-0" onclick="toggleAll(true)">Select All</button>
                        <button type="button" class="btn btn-xs btn-outline-secondary py-0" onclick="toggleAll(false)">Deselect All</button>
                    </div>
                </div>
            `;

            data.speakers.forEach((speaker, index) => {
                const count = data.segments.filter(s => s.speaker === speaker).length;
                const slot = `
                    <div class="card mb-2 bg-light">
                        <div class="card-body p-2">
                            <div class="row align-items-center">
                                <div class="col-md-1">
                                    <input type="checkbox" class="form-check-input speaker-select" data-speaker="${speaker}" checked>
                                </div>
                                <div class="col-md-3">
                                    <strong>${speaker}</strong> <br>
                                    <small class="text-muted">${count} segments</small>
                                </div>
                                <div class="col-md-8">
                                    <input type="file" class="form-control form-control-sm audio-input" data-speaker="${speaker}" accept="audio/*">
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                slotsDiv.innerHTML += slot;
            });
        }

        function updateModelOptions() {
            const type = document.getElementById('alignerType').value;
            const whisperSettings = document.getElementById('whisperSettings');
            if (type === 'mms') {
                whisperSettings.classList.add('d-none');
            } else {
                whisperSettings.classList.remove('d-none');
            }
        }

        function resetProcess() {
            document.getElementById('step1').classList.remove('d-none');
            document.getElementById('step2').classList.add('d-none');
            document.getElementById('resultsSection').classList.add('d-none');
            document.getElementById('metadataForm').reset();
            currentMetadata = null;
        }

        document.getElementById('processForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData();
            formData.append('use_whisper', document.getElementById('useWhisper').checked);
            formData.append('aligner_type', document.getElementById('alignerType').value);
            formData.append('model_size', document.getElementById('modelSize').value);
            formData.append('min_gap', document.getElementById('minGap').value || 0);

            const selects = document.querySelectorAll('.speaker-select:checked');
            if (selects.length === 0) {
                alert('Select at least one speaker to process.');
                return;
            }

            let hasAudio = false;
            selects.forEach(select => {
                const speaker = select.getAttribute('data-speaker');
                const input = document.querySelector(`.audio-input[data-speaker="${speaker}"]`);
                if (input.files[0]) {
                    formData.append(`audio_${speaker}`, input.files[0]);
                    hasAudio = true;
                }
                formData.append('speakers', speaker);
            });

            if (!hasAudio) {
                alert('Upload at least one audio file.');
                return;
            }

            formData.append('segments', JSON.stringify(currentMetadata.segments));

            document.getElementById('progressBar').classList.remove('d-none');
            document.getElementById('processBtn').disabled = true;
            
            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    pollStatus(result.job_id);
                } else {
                    alert('Error: ' + result.error);
                    document.getElementById('progressBar').classList.add('d-none');
                    document.getElementById('processBtn').disabled = false;
                }
            } catch (error) {
                alert('Error processing files: ' + error.message);
                document.getElementById('progressBar').classList.add('d-none');
                document.getElementById('processBtn').disabled = false;
            }
        });

        let pollCount = 0;
        async function pollStatus(jobId) {
            const progressBar = document.querySelector('#progressBar .progress-bar');
            pollCount++;

            try {
                const response = await fetch(`/job/status/${jobId}`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const job = await response.json();

                if (job.status === 'processing' || job.status === 'queued') {
                    progressBar.style.width = job.progress + '%';
                    progressBar.innerText = `[${job.status.toUpperCase()}] Current: ${job.current_speaker || 'starting...'} (${job.progress}%)`;
                    setTimeout(() => pollStatus(jobId), 1500);
                } else if (job.status === 'completed') {
                    progressBar.style.width = '100%';
                    progressBar.innerText = 'All Characters Aligned Successfully!';
                    progressBar.classList.remove('progress-bar-animated');
                    progressBar.classList.add('bg-success');
                    displayResults(job.result);
                    document.getElementById('processBtn').disabled = false;
                    setTimeout(() => {
                        document.getElementById('progressBar').classList.add('d-none');
                    }, 5000);
                } else if (job.status === 'failed') {
                    progressBar.classList.add('bg-danger');
                    progressBar.innerText = 'Error: ' + job.error;
                    alert('Alignment failed: ' + job.error);
                    console.error(job.traceback);
                    document.getElementById('processBtn').disabled = false;
                }
            } catch (error) {
                console.error("Polling error:", error);
                // Exponential backoff or max retries to avoid infinite loops if server is down
                const delay = Math.min(10000, 3000 + (pollCount * 100));
                setTimeout(() => pollStatus(jobId), delay);
            }
        }
        
        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            document.getElementById('resultsSection').classList.remove('d-none');
            
            let html = '<h6>Aligned Character Tracks:</h6>';
            html += '<div class="list-group">';
            
            data.output_files.forEach(track => {
                html += `
                    <div class="list-group-item">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${track.speaker}</strong>
                                <br>
                                <small>${track.file}</small>
                            </div>
                            <div>
                                <audio controls src="/preview/${track.file}"></audio>
                                <a href="/download/${track.file}" class="btn btn-sm btn-primary">Download</a>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            resultsDiv.innerHTML = html;
        }
        
        function downloadAll() {
            window.location.href = '/download_all';
        }
    </script>
</body>
</html>
