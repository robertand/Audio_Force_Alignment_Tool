<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Force Alignment Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peaks.js/dist/peaks.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-slow {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="gradient-bg text-white shadow-lg">
        <div class="container mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-wave-square text-3xl"></i>
                    <h1 class="text-2xl font-bold">Audio Force Alignment Tool</h1>
                </div>
                <div id="systemInfo" class="flex items-center space-x-4 text-sm">
                    <!-- System info will be loaded here -->
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <!-- Step 1: Upload Metadata -->
        <div id="step1" class="max-w-2xl mx-auto">
            <div class="bg-white rounded-xl shadow-lg p-8">
                <div class="flex items-center mb-6">
                    <div class="w-10 h-10 rounded-full gradient-bg text-white flex items-center justify-center font-bold mr-4">1</div>
                    <h2 class="text-2xl font-semibold">Upload Metadata</h2>
                </div>
                
                <form id="metadataForm" class="space-y-6">
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-indigo-500 transition-colors">
                        <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-4"></i>
                        <p class="text-gray-600 mb-2">Drag and drop your metadata file here</p>
                        <p class="text-sm text-gray-500 mb-4">CSV or SRT format</p>
                        <input type="file" id="metadataFile" accept=".csv,.srt" class="hidden" required>
                        <button type="button" onclick="document.getElementById('metadataFile').click()" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition-colors">
                            Browse Files
                        </button>
                        <p class="mt-4 text-sm text-gray-500">CSV format: start,end,speaker,en,ro</p>
                    </div>
                    
                    <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors disabled:opacity-50" id="analyzeBtn">
                        Analyze Metadata
                    </button>
                </form>
            </div>
        </div>

        <!-- Step 2: Character Audio Slots -->
        <div id="step2" class="hidden max-w-4xl mx-auto">
            <div class="bg-white rounded-xl shadow-lg p-8">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-full gradient-bg text-white flex items-center justify-center font-bold mr-4">2</div>
                        <h2 class="text-2xl font-semibold">Upload Character Audio</h2>
                    </div>
                    <button onclick="resetProcess()" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-redo-alt"></i> Reset
                    </button>
                </div>

                <div class="mb-6 p-4 bg-blue-50 rounded-lg" id="metadataInfo">
                    <!-- Metadata info will be shown here -->
                </div>

                <form id="processForm" class="space-y-6">
                    <div class="flex space-x-2 mb-4">
                        <button type="button" onclick="toggleAllSpeakers(true)" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 text-sm">
                            Select All
                        </button>
                        <button type="button" onclick="toggleAllSpeakers(false)" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 text-sm">
                            Deselect All
                        </button>
                    </div>

                    <div id="characterSlots" class="space-y-3">
                        <!-- Character slots will be inserted here -->
                    </div>

                    <div class="border-t pt-6">
                        <h3 class="text-lg font-semibold mb-4">Advanced Settings</h3>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Alignment Engine</label>
                                <div class="space-y-2">
                                    <label class="flex items-center">
                                        <input type="radio" name="aligner" value="whisper" checked class="mr-2">
                                        <span>Whisper (High accuracy, GPU accelerated)</span>
                                    </label>
                                    <label class="flex items-center">
                                        <input type="radio" name="aligner" value="mms" class="mr-2">
                                        <span>MMS (Fast, good for Romanian)</span>
                                    </label>
                                    <label class="flex items-center">
                                        <input type="radio" name="aligner" value="none" class="mr-2">
                                        <span>No alignment (direct mapping)</span>
                                    </label>
                                </div>
                            </div>
                            
                            <div class="space-y-3">
                                <div>
                                    <label class="block text-sm font-medium mb-1">Whisper Model</label>
                                    <select id="whisperModel" class="w-full border rounded-lg px-3 py-2">
                                        <option value="tiny">Tiny (Fastest)</option>
                                        <option value="base" selected>Base (Recommended)</option>
                                        <option value="small">Small (Balanced)</option>
                                        <option value="medium">Medium (Accurate)</option>
                                        <option value="large">Large (Most accurate)</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">Initial Prompt</label>
                                    <input type="text" id="initialPrompt" class="w-full border rounded-lg px-3 py-2" placeholder="e.g., Dialogue in Romanian">
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition-colors disabled:opacity-50" id="processBtn">
                        Process Selected Characters
                    </button>
                </form>

                <!-- Progress Bar -->
                <div id="progressBar" class="hidden mt-6">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium" id="progressStatus">Processing...</span>
                        <span class="text-sm text-gray-500" id="progressPercentage">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" id="progressFill" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Step 3: Timeline Editor -->
        <div id="step3" class="hidden min-h-screen">
            <div class="bg-white rounded-2xl shadow-2xl overflow-hidden border border-gray-100">
                <div class="bg-gray-900 text-white p-6 flex items-center justify-between">
                    <div class="flex items-center">
                        <div class="w-12 h-12 rounded-xl bg-indigo-500 flex items-center justify-center font-bold mr-4 shadow-lg">3</div>
                        <div>
                            <h2 class="text-2xl font-bold">Timeline Editor</h2>
                            <p class="text-gray-400 text-sm">Fine-tune alignments and tempo</p>
                        </div>
                    </div>
                    <div class="flex space-x-3">
                        <button class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition-all flex items-center border border-gray-700" id="exportCsvBtn">
                            <i class="fas fa-file-csv mr-2"></i>Export CSV
                        </button>
                        <button class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition-all flex items-center border border-gray-700" id="exportJsonBtn">
                            <i class="fas fa-file-code mr-2"></i>Export JSON
                        </button>
                        <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded-lg transition-all font-bold shadow-lg" id="generateFinalBtn">
                            <i class="fas fa-rocket mr-2"></i>Generate Tracks
                        </button>
                    </div>
                </div>

                <!-- Batch Controls -->
                <div class="bg-gray-50 border-b border-gray-200 px-6 py-4 flex items-center space-x-4">
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Batch Adjust:</span>
                    <button onclick="batchAdjust('start', -0.5)" class="bg-white border border-gray-200 hover:border-indigo-500 text-gray-700 px-4 py-1.5 rounded-lg text-sm font-medium transition-all shadow-sm">
                        <i class="fas fa-step-backward mr-2 text-indigo-500"></i>Add 0.5s to all Starts
                    </button>
                    <button onclick="batchAdjust('end', 0.5)" class="bg-white border border-gray-200 hover:border-indigo-500 text-gray-700 px-4 py-1.5 rounded-lg text-sm font-medium transition-all shadow-sm">
                        <i class="fas fa-step-forward mr-2 text-indigo-500"></i>Add 0.5s to all Ends
                    </button>
                </div>

                <div id="segmentList" class="divide-y divide-gray-100 bg-gray-50">
                    <!-- Segment blocks will be added dynamically -->
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="hidden mt-8">
            <div class="bg-white rounded-xl shadow-lg p-8">
                <h2 class="text-2xl font-semibold mb-6">Processing Results</h2>
                
                <div id="results" class="space-y-4">
                    <!-- Results will be shown here -->
                </div>

                <div class="mt-6 flex space-x-4">
                    <button class="flex-1 bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition-colors" id="downloadAllBtn">
                        <i class="fas fa-download mr-2"></i>Download All Tracks
                    </button>
                    <button class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors" onclick="startNew()">
                        <i class="fas fa-plus mr-2"></i>Start New Project
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-lg transform transition-transform duration-300 translate-y-full"></div>

    <script>
        // System info
        async function loadSystemInfo() {
            try {
                const response = await fetch('/api/system-info');
                const data = await response.json();
                
                let infoHtml = '';
                if (data.gpu.available) {
                    infoHtml = `
                        <div class="flex items-center text-green-300">
                            <i class="fas fa-microchip mr-2"></i>
                            <span>GPU: ${data.gpu.name} (${data.gpu.memory})</span>
                        </div>
                    `;
                } else {
                    infoHtml = `
                        <div class="flex items-center text-yellow-300">
                            <i class="fas fa-exclamation-triangle mr-2"></i>
                            <span>CPU Mode (GPU not detected)</span>
                        </div>
                    `;
                }
                
                document.getElementById('systemInfo').innerHTML = infoHtml;
            } catch (error) {
                console.error('Failed to load system info:', error);
            }
        }

        // Toast notification
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg transform transition-transform duration-300 ${
                type === 'success' ? 'bg-green-600' : 
                type === 'error' ? 'bg-red-600' : 
                'bg-gray-900'
            } text-white`;
            toast.style.transform = 'translateY(0)';
            
            setTimeout(() => {
                toast.style.transform = 'translateY(100%)';
            }, 3000);
        }

        let currentMetadata = null;
        let currentJobId = null;
        let jobAlignmentResults = null;
        let activeAudio = null;
        let speakerDataCache = {};
        let peaksInstances = {};

        // Initialize
        loadSystemInfo();

        // Metadata form submission
        document.getElementById('metadataForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('metadataFile').files[0];
            
            if (!file) {
                showToast('Please select a file', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('metadata', file);

            try {
                document.getElementById('analyzeBtn').disabled = true;
                document.getElementById('analyzeBtn').innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Analyzing...';

                const response = await fetch('/api/upload-metadata', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    currentMetadata = result;
                    showStep2(result);
                    showToast('Metadata analyzed successfully', 'success');
                } else {
                    showToast('Error: ' + result.error, 'error');
                }
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            } finally {
                document.getElementById('analyzeBtn').disabled = false;
                document.getElementById('analyzeBtn').innerHTML = 'Analyze Metadata';
            }
        });

        function showStep2(data) {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');

            const metadataInfo = document.getElementById('metadataInfo');
            metadataInfo.innerHTML = `
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div>
                        <div class="text-sm text-blue-600">File</div>
                        <div class="font-medium">${data.filename}</div>
                    </div>
                    <div>
                        <div class="text-sm text-blue-600">Speakers</div>
                        <div class="font-medium">${data.stats.speaker_count}</div>
                    </div>
                    <div>
                        <div class="text-sm text-blue-600">Segments</div>
                        <div class="font-medium">${data.stats.total_segments}</div>
                    </div>
                    <div>
                        <div class="text-sm text-blue-600">Duration</div>
                        <div class="font-medium">${data.stats.total_duration.toFixed(2)}s</div>
                    </div>
                </div>
            `;

            const slotsDiv = document.getElementById('characterSlots');
            slotsDiv.innerHTML = '';

            data.speakers.forEach((speaker) => {
                const count = data.stats.segments_per_speaker[speaker];
                const slot = document.createElement('div');
                slot.className = 'bg-gray-50 rounded-lg p-4 border border-gray-200';
                slot.innerHTML = `
                    <div class="flex items-center">
                        <div class="flex items-center w-1/3">
                            <input type="checkbox" class="speaker-select w-4 h-4 text-indigo-600 rounded" data-speaker="${speaker}" checked>
                            <div class="ml-3">
                                <div class="font-medium">${speaker}</div>
                                <div class="text-xs text-gray-500">${count} segments</div>
                            </div>
                        </div>
                        <div class="flex-1 ml-4">
                            <input type="file" class="audio-input w-full text-sm" data-speaker="${speaker}" accept="audio/*">
                        </div>
                    </div>
                `;
                slotsDiv.appendChild(slot);
            });
        }

        function toggleAllSpeakers(checked) {
            document.querySelectorAll('.speaker-select').forEach(cb => cb.checked = checked);
        }

        function resetProcess() {
            document.getElementById('step1').classList.remove('hidden');
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('resultsSection').classList.add('hidden');
            document.getElementById('metadataForm').reset();
            currentMetadata = null;
        }

        // Process form submission
        document.getElementById('processForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const aligner = document.querySelector('input[name="aligner"]:checked').value;
            const selects = document.querySelectorAll('.speaker-select:checked');
            
            if (selects.length === 0) {
                showToast('Select at least one speaker to process', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('segments', JSON.stringify(currentMetadata.segments));
            formData.append('use_whisper', aligner === 'whisper');
            formData.append('use_mms', aligner === 'mms');
            formData.append('whisper_model', document.getElementById('whisperModel').value);
            formData.append('initial_prompt', document.getElementById('initialPrompt').value);

            let hasAudio = false;
            selects.forEach(select => {
                const speaker = select.getAttribute('data-speaker');
                const input = document.querySelector(`.audio-input[data-speaker="${speaker}"]`);
                if (input.files[0]) {
                    formData.append(`audio_${speaker}`, input.files[0]);
                    hasAudio = true;
                }
                formData.append('speakers', speaker);
            });

            if (!hasAudio) {
                showToast('Upload at least one audio file', 'error');
                return;
            }

            // Show progress
            document.getElementById('progressBar').classList.remove('hidden');
            document.getElementById('processBtn').disabled = true;

            try {
                const response = await fetch('/api/process', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    currentJobId = result.job_id;
                    pollJobStatus(result.job_id);
                    showToast('Processing started', 'success');
                } else {
                    showToast('Error: ' + result.error, 'error');
                    document.getElementById('progressBar').classList.add('hidden');
                    document.getElementById('processBtn').disabled = false;
                }
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
                document.getElementById('progressBar').classList.add('hidden');
                document.getElementById('processBtn').disabled = false;
            }
        });

        async function pollJobStatus(jobId) {
            const poll = async () => {
                try {
                    const response = await fetch(`/api/job/${jobId}`);
                    const data = await response.json();

                    if (data.status.includes('✅')) {
                        document.getElementById('progressBar').classList.add('hidden');
                        document.getElementById('processBtn').disabled = false;
                        jobAlignmentResults = data.results;
                        showStep3(data.results);
                        showToast('Processing completed!', 'success');
                    } else if (data.status.includes('❌')) {
                        showToast('Job failed: ' + data.error, 'error');
                        document.getElementById('progressBar').classList.add('hidden');
                        document.getElementById('processBtn').disabled = false;
                    } else {
                        document.getElementById('progressFill').style.width = data.progress + '%';
                        document.getElementById('progressPercentage').innerText = data.progress + '%';
                        document.getElementById('progressStatus').innerText = data.status;
                        setTimeout(poll, 1000);
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                    setTimeout(poll, 2000);
                }
            };
            poll();
        }

        function showStep3(results) {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
            
            const list = document.getElementById('segmentList');
            list.innerHTML = '';

            const speakers = [...new Set(results.map(s => s.speaker))];
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            await Promise.all(speakers.map(async (speaker) => {
                if (!speakerDataCache[speaker]) {
                    try {
                        const [waveformResp, audioUrl] = await Promise.all([
                            fetch(`/api/waveform-data/${currentJobId}/${speaker}`).then(r => r.json()),
                            `/api/original-audio/${currentJobId}/${speaker}`
                        ]);
                        const audio = new Audio(audioUrl);
                        audio.preload = 'auto';
                        speakerDataCache[speaker] = {
                            peaks: waveformResp.peaks,
                            audioUrl: audioUrl,
                            sharedAudio: audio,
                            audioContext: audioCtx
                        };
                    } catch (e) {
                        console.error(`Failed to load data for ${speaker}:`, e);
                    }
                }
            }));

            results.forEach((seg, index) => {
                const block = document.createElement('div');
                block.className = `p-6 bg-white hover:bg-indigo-50/30 transition-colors group relative`;
                block.id = `seg-${index}`;

                const confidenceColor = seg.confidence > 0.7 ? 'text-green-600' :
                                      seg.confidence > 0.4 ? 'text-yellow-600' : 'text-red-600';

                block.innerHTML = `
                    <div class="flex flex-col lg:flex-row lg:items-center gap-6">
                        <div class="w-full lg:w-72 flex-shrink-0">
                            <div class="flex items-center justify-between mb-2">
                                <span class="px-2 py-1 bg-indigo-100 text-indigo-700 rounded text-xs font-bold uppercase tracking-wider">${seg.speaker}</span>
                                <div class="flex items-center ${confidenceColor} text-[10px] font-bold">
                                    <i class="fas fa-circle mr-1 text-[6px]"></i>
                                    ${Math.round(seg.confidence * 100)}% Match
                                </div>
                            </div>
                            <p class="text-gray-800 font-medium text-sm leading-relaxed line-clamp-2 mb-3" title="${seg.text_ro}">
                                ${seg.text_ro}
                            </p>
                            <div class="flex items-center space-x-2">
                                <button onclick="previewSegment(this, '${seg.speaker}', ${index})" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center shadow-md shadow-indigo-100">
                                    <i class="fas fa-play mr-2"></i> Preview
                                </button>
                                <div class="flex items-center bg-gray-100 px-3 py-2 rounded-lg">
                                    <span class="text-[10px] font-bold text-gray-400 mr-2 uppercase">Tempo</span>
                                    <input type="number" step="0.01" min="0.5" max="2.0" class="w-12 bg-transparent border-none focus:ring-0 text-sm font-bold text-gray-700 p-0 tempo" value="1.00">
                                    <span class="text-xs text-gray-400 font-bold ml-1">x</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex-1 min-w-0">
                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
                                    <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Metadata Timing (CSV)</div>
                                    <div class="flex items-center space-x-3">
                                        <input type="number" step="0.01" class="w-full bg-white border border-gray-200 rounded-lg px-2 py-1.5 text-sm font-mono csv-start" value="${seg.csv_start}">
                                        <span class="text-gray-300">→</span>
                                        <input type="number" step="0.01" class="w-full bg-white border border-gray-200 rounded-lg px-2 py-1.5 text-sm font-mono csv-end" value="${seg.csv_end}">
                                    </div>
                                </div>
                                <div class="bg-white p-3 rounded-xl border border-indigo-100 shadow-sm shadow-indigo-50">
                                    <div class="flex items-center justify-between mb-2">
                                        <div class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest">Source Audio Timing</div>
                                        <span class="delta-label text-[10px] font-black uppercase bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full"></span>
                                    </div>
                                    <div class="flex items-center space-x-3">
                                        <input type="number" step="0.01" class="w-full bg-indigo-50/30 border border-indigo-100 rounded-lg px-2 py-1.5 text-sm font-mono text-indigo-700 source-start" value="${seg.source_start}">
                                        <span class="text-indigo-200">→</span>
                                        <input type="number" step="0.01" class="w-full bg-indigo-50/30 border border-indigo-100 rounded-lg px-2 py-1.5 text-sm font-mono text-indigo-700 source-end" value="${seg.source_end}">
                                    </div>
                                </div>
                            </div>

                            <div class="bg-white rounded-xl border border-gray-100 overflow-hidden shadow-inner relative">
                                <div id="overview-${index}" class="w-full h-8 border-b border-gray-50"></div>
                                <div id="zoomview-${index}" class="w-full h-12"></div>
                            </div>
                        </div>
                    </div>
                `;
                list.appendChild(block);
                initWaveform(index, seg.speaker, seg.source_start, seg.source_end);
            });

            document.getElementById('exportCsvBtn').onclick = () => exportResults('csv');
            document.getElementById('exportJsonBtn').onclick = () => exportResults('json');
        }

        function initWaveform(index, speaker, start, end) {
            const overviewContainer = document.getElementById(`overview-${index}`);
            const zoomviewContainer = document.getElementById(`zoomview-${index}`);
            const data = speakerDataCache[speaker];
            if (!data || !data.peaks) return;

            const options = {
                overview: { container: overviewContainer, waveformColor: '#f1f5f9', playedWaveformColor: '#cbd5e1', highlightColor: '#818cf8', showAxisLabels: false, waveformHeight: 32 },
                zoomview: { container: zoomviewContainer, waveformColor: '#e0e7ff', playheadColor: '#4f46e5', axisLabelColor: '#94a3b8', showAxisLabels: true, waveformHeight: 48 },
                mediaElement: data.sharedAudio,
                data: { peaks: data.peaks },
                webAudio: { audioContext: data.audioContext, multiChannel: false },
                contentEditable: false
            };

            peaks.init(options, (err, peaksInstance) => {
                if (err) { console.error('Peaks init error:', err); return; }
                peaksInstances[index] = peaksInstance;
                peaksInstance.segments.add({ id: `seg-marker-${index}`, startTime: start, endTime: end, editable: true, color: '#6366f1', labelText: 'Aligned' });
                const block = document.getElementById(`seg-${index}`);
                const inputs = block.querySelectorAll('input');
                const updateView = () => {
                    const s = parseFloat(block.querySelector('.source-start').value), e = parseFloat(block.querySelector('.source-end').value);
                    const csvS = parseFloat(block.querySelector('.csv-start').value), csvE = parseFloat(block.querySelector('.csv-end').value);
                    const tempo = parseFloat(block.querySelector('.tempo').value) || 1.0;
                    const segment = peaksInstance.segments.getSegment(`seg-marker-${index}`);
                    if (segment && !isNaN(s) && !isNaN(e) && e > s) segment.update({ startTime: s, endTime: e });
                    const deltaLabel = block.querySelector('.delta-label');
                    const targetDuration = csvE - csvS, sourceDuration = (e - s) / tempo, diff = sourceDuration - targetDuration;
                    if (Math.abs(diff) < 0.01) { deltaLabel.textContent = 'Perfect Match'; deltaLabel.className = 'delta-label text-green-500 text-[10px] font-black uppercase bg-green-50 px-2 py-0.5 rounded-full'; }
                    else if (diff > 0) { deltaLabel.textContent = `+${diff.toFixed(2)}s Added`; deltaLabel.className = 'delta-label text-blue-500 text-[10px] font-black uppercase bg-blue-50 px-2 py-0.5 rounded-full'; }
                    else { deltaLabel.textContent = `${diff.toFixed(2)}s Removed`; deltaLabel.className = 'delta-label text-orange-500 text-[10px] font-black uppercase bg-orange-50 px-2 py-0.5 rounded-full'; }
                };
                peaksInstance.on('segments.dragged', (segment) => {
                    if (segment.id === `seg-marker-${index}`) {
                        block.querySelector('.source-start').value = segment.startTime.toFixed(2);
                        block.querySelector('.source-end').value = segment.endTime.toFixed(2);
                        updateView();
                    }
                });
                inputs.forEach(input => input.addEventListener('input', updateView));
                setTimeout(updateView, 100);
            });
        }

        function batchAdjust(field, delta) {
            const selector = field === 'start' ? '.source-start' : '.source-end';
            document.querySelectorAll(selector).forEach(input => {
                const newVal = Math.max(0, parseFloat(input.value) + delta);
                input.value = newVal.toFixed(2);
                input.dispatchEvent(new Event('input'));
            });
            showToast(`Adjusted all ${field}s by ${delta}s`, 'success');
        }

        function previewSegment(btn, speaker, index) {
            const data = speakerDataCache[speaker];
            const audio = data.sharedAudio;
            if (activeAudio) {
                activeAudio.pause();
                const oldBtn = activeAudio.btn;
                if (oldBtn) oldBtn.innerHTML = '<i class="fas fa-play mr-2"></i> Preview';
                if (activeAudio === audio && activeAudio.segmentIndex === index) { activeAudio = null; return; }
            }
            const block = document.getElementById(`seg-${index}`);
            const start = parseFloat(block.querySelector('.source-start').value), end = parseFloat(block.querySelector('.source-end').value);
            const tempo = parseFloat(block.querySelector('.tempo').value) || 1.0;
            if (isNaN(start) || isNaN(end) || start >= end) { showToast('Invalid start/end times', 'error'); return; }
            audio.playbackRate = tempo; audio.currentTime = start; audio.segmentIndex = index; activeAudio = audio; audio.btn = btn; btn.innerHTML = '<i class="fas fa-stop mr-2"></i> Stop';
            audio.play().catch(e => { showToast('Playback error: ' + e.message, 'error'); btn.innerHTML = '<i class="fas fa-play mr-2"></i> Preview'; });
            const checkEnd = () => {
                if (audio.currentTime >= end || audio.paused || activeAudio !== audio || audio.segmentIndex !== index) {
                    audio.pause(); btn.innerHTML = '<i class="fas fa-play mr-2"></i> Preview';
                    if (activeAudio === audio && audio.segmentIndex === index) activeAudio = null;
                    audio.removeEventListener('timeupdate', checkEnd);
                }
            };
            audio.addEventListener('timeupdate', checkEnd);
        }

        function exportResults(format) {
            const blocks = document.querySelectorAll('#segmentList > div');
            const data = [];

            blocks.forEach((block, index) => {
                const orig = jobAlignmentResults[index];
                data.push({
                    speaker: orig.speaker,
                    text_ro: orig.text_ro,
                    text_en: orig.text_en,
                    csv_start: parseFloat(block.querySelector('.csv-start').value),
                    csv_end: parseFloat(block.querySelector('.csv-end').value),
                    source_start: parseFloat(block.querySelector('.source-start').value),
                    source_end: parseFloat(block.querySelector('.source-end').value),
                    tempo: parseFloat(block.querySelector('.tempo').value) || 1.0,
                    confidence: orig.confidence
                });
            });

            let content, filename, mime;
            if (format === 'csv') {
                const headers = ['speaker', 'text_ro', 'text_en', 'csv_start', 'csv_end', 'source_start', 'source_end', 'confidence'];
                const csv = [headers.join(',')];
                data.forEach(row => {
                    csv.push(headers.map(h => row[h]).join(','));
                });
                content = csv.join('\n');
                filename = 'alignment_results.csv';
                mime = 'text/csv';
            } else {
                content = JSON.stringify(data, null, 2);
                filename = 'alignment_results.json';
                mime = 'application/json';
            }

            const blob = new Blob([content], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Generate final tracks
        document.getElementById('generateFinalBtn').addEventListener('click', async () => {
            const generateBtn = document.getElementById('generateFinalBtn');
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Generating...';

            // Collect adjusted data
            const blocks = document.querySelectorAll('#segmentList > div');
            const adjustedAlignments = [];

            blocks.forEach((block, index) => {
                const orig = jobAlignmentResults[index];
                adjustedAlignments.push({
                    ...orig,
                    csv_start: parseFloat(block.querySelector('.csv-start').value),
                    csv_end: parseFloat(block.querySelector('.csv-end').value),
                    source_start: parseFloat(block.querySelector('.source-start').value),
                    source_end: parseFloat(block.querySelector('.source-end').value),
                    tempo: parseFloat(block.querySelector('.tempo').value) || 1.0
                });
            });

            try {
                const response = await fetch('/api/generate-final', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        job_id: currentJobId, 
                        alignments: adjustedAlignments,
                        download_all: true
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    displayResults(result);
                    showToast('Tracks generated successfully', 'success');
                } else {
                    showToast('Error: ' + result.error, 'error');
                }
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = 'Generate Final Tracks';
            }
        });

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('resultsSection').classList.remove('hidden');

            let html = '<div class="space-y-3">';

            data.output_files.forEach(track => {
                html += `
                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg">
                        <div>
                            <div class="font-medium">${track.speaker}</div>
                            <div class="text-sm text-gray-500">${track.duration.toFixed(2)}s • ${(track.size / 1024).toFixed(1)} KB</div>
                        </div>
                        <div class="flex space-x-2">
                            <audio controls src="/api/preview/${track.file}" class="h-10"></audio>
                            <a href="/api/download/${track.file}" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">
                                <i class="fas fa-download"></i>
                            </a>
                        </div>
                    </div>
                `;
            });

            if (data.zip_file) {
                html += `
                    <div class="mt-4 p-4 bg-green-50 rounded-lg">
                        <div class="flex items-center justify-between">
                            <span class="font-medium">All Tracks (ZIP)</span>
                            <a href="/api/download/${data.zip_file}" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
                                <i class="fas fa-file-archive mr-2"></i>Download All
                            </a>
                        </div>
                    </div>
                `;
            }

            html += '</div>';
            resultsDiv.innerHTML = html;
        }

        function startNew() {
            window.location.reload();
        }
    </script>
</body>
</html>
